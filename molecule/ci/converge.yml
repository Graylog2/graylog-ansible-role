---
- hosts: "all"
  vars:
    # archive.ubuntu.com is often slow from GitHub's runners
    ubuntu_apt_mirror: "http://azure.archive.ubuntu.com/ubuntu"
  tasks:
    - name: "Fix missing dir"
      file:
        path: "/usr/share/man/man1"
        state: "directory"
    # Ubuntu >= 24.04 uses ubuntu.sources (deb822); older releases use sources.list.
    - name: "Find the Ubuntu apt sources file"
      stat:
        path: "{{ item }}"
      loop:
        - "/etc/apt/sources.list.d/ubuntu.sources"
        - "/etc/apt/sources.list"
      register: ubuntu_apt_sources
      when: ansible_distribution == 'Ubuntu'
    - name: "Use a faster Ubuntu mirror"
      replace:
        path: "{{ item.stat.path }}"
        regexp: 'http://(archive|security)\.ubuntu\.com/ubuntu'
        replace: "{{ ubuntu_apt_mirror }}"
      loop: "{{ ubuntu_apt_sources.results | default([]) | selectattr('stat', 'defined') | selectattr('stat.exists') | list }}"
      loop_control:
        label: "{{ item.stat.path }}"
      when: ansible_distribution == 'Ubuntu'
    - name: "Install packages (Ubuntu)"
      apt:
        update_cache: yes
        pkg:
          - "gpg-agent"
          - "curl"
        state: "latest"
      when: ansible_distribution == 'Ubuntu'
    - name: "Install packages (Debian)"
      apt:
        update_cache: yes
        pkg:
          - "gpg-agent"
          - "curl"
        state: "latest"
      when: ansible_distribution == 'Debian'

- hosts: "all"
  vars:

    # Graylog vars
    # Set by GRAYLOG_VERSION in .github/workflows/ci.yml; the default is for local runs.
    graylog_version: "{{ lookup('env', 'GRAYLOG_VERSION') | default('7.2', true) }}"
    graylog_install_java: False
    graylog_install_enterprise_plugins: True
    graylog_install_integrations_plugins: True
    graylog_install_enterprise_integrations_plugins: True
    graylog_install_open_package: True
    graylog_install_enterprise_package: False
    graylog_not_testing: False
    graylog_password_secret: "2jueVqZpwLLjaWxV"
    graylog_root_password_sha2: "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918"
    graylog_http_bind_address: "{{ ansible_default_ipv4.address }}:9000"
    graylog_http_publish_uri: "http://{{ ansible_default_ipv4.address }}:9000/"
    graylog_http_external_uri: "http://{{ ansible_default_ipv4.address }}:9000/"

  roles:
    - role: "Graylog2.graylog"
      tags:
        - "graylog"
